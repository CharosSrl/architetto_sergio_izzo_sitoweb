[build]
  command = "npm run build"
  publish = "dist/studio-izzo-web/browser"

# Fallback per il routing SPA di Angular: ogni rotta serve index.html
# (deep link come /progetti/villa-malfi-pomigliano funzionano al refresh).
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Security headers per tutte le pagine
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# Cache breve per index.html (la SPA aggiornata viene servita subito)
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Cache lunga per asset statici con hash nel nome (JS/CSS bundle Angular)
[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
